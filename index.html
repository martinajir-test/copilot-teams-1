<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>User Profile</h1>
        <div id="profile-view" class="profile-card">
            <div class="avatar" id="avatar-display">?</div>
            <h2 id="display-name">No Name Set</h2>
            <p id="display-email" class="email"></p>
            <p id="display-bio" class="bio"></p>
            <button id="edit-btn" class="btn btn-primary">Edit Profile</button>
        </div>
        <div id="profile-edit" class="profile-card hidden">
            <form id="profile-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="bio">Bio</label>
                    <textarea id="bio" name="bio" placeholder="Tell us about yourself" rows="3"></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <button type="button" id="cancel-btn" class="btn btn-secondary">Cancel</button>
                </div>
            </form>
        </div>
        <div id="toast" class="toast hidden">Profile saved!</div>
    </div>
    <script src="profile.js"></script>
</body>
</html>
